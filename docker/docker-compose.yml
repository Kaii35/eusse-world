# Entorno de desarrollo local (paso A3).
# `pnpm db:up` levanta todo. Nadie debería instalar PostgreSQL a mano.
name: eusse-world

services:
  postgres:
    image: postgres:16-alpine
    container_name: eusse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eusse
      POSTGRES_PASSWORD: eusse
      POSTGRES_DB: eusse
      # Un esquema por contexto acotado (ADR-0006). Los crea la migración inicial.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eusse -d eusse']
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      # Verificar planes de consulta en local con las mismas herramientas que en producción
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=200

  redis:
    image: redis:7-alpine
    container_name: eusse-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Correo transaccional en local. Interfaz web en http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: eusse-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'
    logging:
      driver: none

  # Almacenamiento de objetos compatible con S3 (ADR-0017). Consola en http://localhost:9001
  minio:
    image: minio/minio:latest
    container_name: eusse-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: eusse
      MINIO_ROOT_PASSWORD: eusse-local-dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Crea el bucket de medios al arrancar y sale
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 eusse eusse-local-dev;
      mc mb --ignore-existing local/eusse-media;
      mc anonymous set download local/eusse-media;
      exit 0;
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
